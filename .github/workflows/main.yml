
name: Build RectMiner (Minecraft 1.7.10)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.9.1'

      - name: Descargar paquete de desarrollo de Forge
        shell: bash
        run: |
          VERSION="1.7.10-10.13.4.1614-1.7.10"
          FILE="forge-${VERSION}-userdev.jar"
          DIR="$HOME/.gradle/caches/minecraft/net/minecraftforge/forge/${VERSION}"
          URL="https://maven.minecraftforge.net/net/minecraftforge/forge/${VERSION}/${FILE}"

          mkdir -p "$DIR"

          echo "Descargando: $FILE"
          curl --fail --location --retry 3 "$URL" --output "$DIR/$FILE"

          test -s "$DIR/$FILE"
          echo "Paquete descargado. Comprobando archivo..."
          file "$DIR/$FILE"

      - name: Compilar RectMiner
        run: gradle --no-daemon build --stacktrace

      - name: Guardar JAR
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RectMiner1710
          path: '**/build/libs/*.jar'
          if-no-files-found: error
