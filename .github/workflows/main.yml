

name: Build RectMiner (Minecraft 1.7.10)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Instalar Gradle compatible
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.9.1'

      - name: Encontrar proyecto
        id: locate
        shell: bash
        run: |
          BUILD_FILE=$(find . -type f -name build.gradle \
            -not -path './.git/*' | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No se encontró build.gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Proyecto encontrado en: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Compilar mod
        shell: bash
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          gradle --no-daemon build --stacktrace

      - name: Guardar JAR
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RectMiner1710
          path: '**/build/libs/*.jar'
          if-no-files-found: error
