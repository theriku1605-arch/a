
buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            url = "https://jitpack.io"
        }
    }

    dependencies {
        classpath 'com.github.GTNewHorizons:ForgeGradle:1.2.11'
    }
}

apply plugin: 'forge'

version = '0.1.0'
group = 'com.example.rectminer'
archivesBaseName = 'RectMiner-1.7.10'

repositories {
    mavenCentral()
    maven {
        name = "forge"
        url = "https://maven.minecraftforge.net/"
    }
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        def module = details.requested.name

        if (details.requested.group == 'org.scala-lang' &&
            module in [
                'scala-parser-combinators_2.11',
                'scala-swing_2.11',
                'scala-xml_2.11'
            ]) {
            details.useTarget(
                "org.scala-lang.modules:${module}:${details.requested.version}"
            )
        }
    }
}

minecraft {
    version = '1.7.10-10.13.4.1614-1.7.10'
    runDir = 'eclipse'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.7.10'

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand(
            'version': project.version,
            'mcversion': '1.7.10'
        )
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

sourceCompatibility = 1.7
targetCompatibility = 1.7
